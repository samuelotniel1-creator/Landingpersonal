<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Samuel Otniel Díaz González | Modo Analista</title>
<meta name="description" content="Samuel Otniel Díaz González — Coordinador de Data y analista de datos. Modo Analista.">
<style>
:root{--bg:#020507;--green:#00e85c;--text:#f5f7f8;--muted:#aab3ba}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(circle at 15% 15%,#063a68 0,#061522 25%,#020507 55%);
  color:var(--text);font-family:Inter,Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 16px;
}

.hero-wrap{width:100%;max-width:1536px}
.hero{
  position:relative;width:100%;aspect-ratio:1536/864;
  border-radius:14px;overflow:hidden;box-shadow:0 30px 90px #000a;
}
.hero img{width:100%;height:100%;object-fit:cover;display:block}

/* Clickable hotspots placed over the platform rows baked into the image.
   Coordinates are percentages measured from the source 1536x864 artwork. */
.hotspot{
  position:absolute;display:block;text-decoration:none;
  border-radius:10px;
}
.hotspot.tiktok{left:47.4%;top:61.7%;width:20.18%;height:13.66%}
.hotspot.instagram{left:73.05%;top:61.9%;width:22.53%;height:13.19%}

.hotspot:hover{background:#ffffff0d}

.chip{
  position:absolute;top:0.8%;height:98.3%;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:#050b10;border:1px solid #1b2933;
  box-shadow:0 0 0 0 #00e85c00;
  transition:.18s;
}
.hotspot.tiktok .chip{left:61.9%;width:38.06%}
.hotspot.instagram .chip{left:67.05%;width:32.37%}

.chip svg{width:38%;height:38%;color:var(--green)}
.hotspot:hover .chip{
  background:var(--green);border-color:var(--green);
  box-shadow:0 0 24px #00e85c55;
}
.hotspot:hover .chip svg{color:#001a0a}

.hint{
  display:none;text-align:center;font-size:12px;letter-spacing:1.5px;
  color:#7f8b93;margin-top:10px;
}

.services{width:100%;max-width:1536px;margin-top:26px;text-align:center}
.services-lead{font-size:16px;color:#d7dde1;margin:0 0 14px;line-height:1.5}
.services-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:12px}
.services-tags span{
  font-size:12px;letter-spacing:1.5px;font-weight:800;color:#04170c;
  background:var(--green);padding:8px 16px;border-radius:999px;
}
.services-note{font-size:12px;color:#697780;margin:0}

.wa-cta{
  display:flex;align-items:center;gap:16px;width:100%;max-width:1536px;margin-top:18px;
  padding:18px 22px;border-radius:16px;text-decoration:none;
  background:var(--green);color:#001a0a;transition:.18s;
}
.wa-cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px #00e85c40}
.wa-cta .ico{
  width:46px;height:46px;flex:none;border-radius:12px;background:#001a0a;
  display:flex;align-items:center;justify-content:center;
}
.wa-cta .ico svg{width:24px;height:24px;color:var(--green)}
.wa-cta .meta{display:flex;flex-direction:column;line-height:1.3}
.wa-cta .meta b{font-size:17px;font-weight:800}
.wa-cta .meta small{font-size:13px;font-weight:600;opacity:.75}
.wa-cta .go{margin-left:auto;font-size:20px;opacity:.6;transition:.18s}
.wa-cta:hover .go{opacity:1;transform:translateX(3px)}

@media(max-width:820px){
  body{padding:18px 0}
  .hero-wrap{overflow-x:auto;padding:0 16px}
  .hero{width:820px}
  .hint{display:block}
  .services{padding:0 16px}
  .wa-cta{max-width:calc(100% - 32px)}
}
</style>
</head>
<body>

<div class="hero-wrap">
  <div class="hero">
    <img src="presentacion-samuel.png" alt="Samuel Otniel Díaz González — Coordinador de Data y analista de datos. Modo Analista.">

    <a class="hotspot tiktok" href="https://www.tiktok.com/@.modo.analista" target="_blank" rel="noopener" aria-label="Abrir TikTok @.modo.analista">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2h3.1c.2 1.6 1.1 3 2.5 3.9V9c-1.5 0-2.9-.4-4.1-1.2v6.7c0 3.1-2.5 5.5-5.5 5.5S3.5 17.6 3.5 14.5 6 9 9.1 9c.3 0 .6 0 .9.1v3.2c-.3-.1-.6-.2-.9-.2-1.4 0-2.5 1.1-2.5 2.5S7.7 17.1 9.1 17.1s2.5-1.1 2.5-2.5V2z"/></svg>
      </span>
    </a>

    <a class="hotspot instagram" href="https://www.instagram.com/MODOANALISTA_/" target="_blank" rel="noopener" aria-label="Abrir Instagram @MODOANALISTA_">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
      </span>
    </a>
  </div>
  <div class="hint">DESLIZA PARA VER TODO →</div>
</div>

<section class="services">
  <p class="services-lead">Diseño landings, automatizo tareas y doy mentorías personalizadas.</p>
  <div class="services-tags">
    <span>LANDINGS</span><span>AUTOMATIZACIÓN</span><span>MENTORÍAS 1:1</span>
  </div>
  <p class="services-note">Servicios profesionales con costo · cotización según proyecto</p>
</section>

<a class="wa-cta" href="https://wa.me/5213329467402?text=Hola%20Samuel%2C%20vi%20tu%20landing%20y%20quiero%20informaci%C3%B3n%20sobre%20tus%20servicios" target="_blank" rel="noopener">
  <span class="ico">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="8,18 8,22 12,18" fill="currentColor"/></svg>
  </span>
  <span class="meta"><b>Escríbeme por WhatsApp</b><small>+52 1 33 2946 7402</small></span>
  <span class="go">→</span>
</a>

</body>
</html>
